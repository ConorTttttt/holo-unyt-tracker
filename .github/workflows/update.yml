name: Update HOT bridge data
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bridge-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Fetch Etherscan data
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: python update.py
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/bridge.json data/events.json && [ -z "$(git ls-files --others --exclude-standard -- data/events.json)" ]; then
            echo 'No updates.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/bridge.json data/events.json
          git commit -m 'Update verified bridge event and vault metrics'
          git push

name: Install bridge tracker package
on:
  push:
    paths:
      - '.project-seed.txz.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and install tracker source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .project-seed.txz.b64 ]; then
            echo "Source seed absent; nothing to install."
            exit 0
          fi
          base64 --decode .project-seed.txz.b64 > /tmp/holo-project.txz
          echo "287bea84c7b611f62e0a28bb16ad6b8ba2a9859181cc01a5c42008224d152ac7  /tmp/holo-project.txz" | sha256sum -c -
          tar -tJf /tmp/holo-project.txz | grep -E '(^/|\.\.)' && { echo 'Unsafe archive entries'; exit 1; } || true
          tar -xJf /tmp/holo-project.txz -C .
          python -m unittest discover -s tests -v
          rm .project-seed.txz.b64
          rm .github/workflows/install.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Install verified HOLO Unyt community tracker"
          git push
